name: Orca 2.5 Windows compatibility
on:
  push:
    branches: [codex/orca-2.5-alpha]
  pull_request:
    paths: ['patches/creality-orca-2.5.0-alpha.patch', 'scripts/**', 'installer/**', 'tests/**', 'config/**', '.github/workflows/port-2.5.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: orca-25-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: OrcaSlicer/OrcaSlicer
          ref: 3880f2c58ec392ed2bd5938ab31c9c7c496c0eb2
          path: orca
      - name: Prepare pinned source and verified web resources
        run: ./scripts/prepare-2.5.ps1 -OrcaSource orca -WorkDirectory build/downloads
      - name: Set up native Perl
        run: |
          if (!(Test-Path C:/Strawberry/perl/bin/perl.exe)) { choco install strawberryperl --no-progress -y }
          'C:/Strawberry/perl/bin' >> $env:GITHUB_PATH
      - name: Cache exact upstream dependencies
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: orca/deps/build/OrcaSlicer_dep
          key: orca-25-3880f2c-win2022-msvc-deps-v1
      - name: Build dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        working-directory: orca
        run: |
          ./build_win.bat -d --arch x64 --msvc --msbuild --vs 2022 -j 3
          if ($LASTEXITCODE -ne 0) { throw 'Dependency build failed.' }
      - name: Save compiled dependencies before compiling the port
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: orca/deps/build/OrcaSlicer_dep
          key: orca-25-3880f2c-win2022-msvc-deps-v1
      - name: Build patched OrcaSlicer
        working-directory: orca
        run: |
          ./build_win.bat -s -i --arch x64 --msvc --msbuild --vs 2022 -j 3
          if ($LASTEXITCODE -ne 0) { throw 'OrcaSlicer build failed.' }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Package and verify installer
        run: ./scripts/package-2.5.ps1 -BuiltDirectory orca/build/OrcaSlicer -WorkDirectory build/package -OutputDirectory release/2.5.0-alpha
      - name: Upload tested build and manifest
        uses: actions/upload-artifact@v4
        with:
          name: creality-orca-2.5.0-alpha-windows-x64
          path: release/2.5.0-alpha/
          if-no-files-found: error
      - name: Save build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-diagnostics
          path: |
            orca/build/CMakeFiles/CMakeConfigureLog.yaml
            orca/deps/build/**/CMakeFiles/CMakeConfigureLog.yaml
            orca/deps/build/**/src/*-stamp/*-*.log
